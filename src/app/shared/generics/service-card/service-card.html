<div class="relative w-[430px]">
    <div class="absolute inset-x-2 bottom-[-10px] h-[90%] rounded-[22px]
    bg-[#E2DCF8] blur-[2px]"></div>

    <div class="relative rounded-[20px] p-6 min-h-[326px]
    bg-[#F5F1FD]
    shadow-[0_12px_30px_rgba(92,66,242,0.12)]
    transition-all duration-300
    hover:-translate-y-1 hover:shadow-[0_18px_40px_rgba(92,66,242,0.18)]
    overflow-hidden">

        <div class="opacity-5 absolute bottom-5 right-5">
            <img [src]="bgImage()" alt="">
        </div>

        <div class="pointer-events-none absolute
             -top-16 -right-16
             w-[260px] h-[260px]
             rounded-full
             bg-gradient-to-br
             from-white/60
             via-white/30
             to-transparent
             blur-[30px]"></div>

        <div class="relative w-16 h-16 rounded-xl bg-white
             flex items-center justify-center mb-4
             shadow-[0_6px_16px_rgba(0,0,0,0.08)]">
            <img [src]="iconLink()" alt="">
        </div>

        <h3 class="relative mb-2 max-w-[90%]">
            {{ title() }}
        </h3>

        <p class="relative text-sm text-gray-600 leading-relaxed max-w-[92%]">
            {{ description() }}
        </p>

        <div class="absolute bottom-5 left-6 w-8 h-8 rounded-full
             bg-[#CFC7F6] flex items-center justify-center
             shadow-[0_6px_12px_rgba(92,66,242,0.25)] cursor-pointer">
            <i class="icon-chevron-thin-right text-white text-sm"></i>
        </div>
    </div>
</div>
