<div
  class="bg-white rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-shadow duration-300 flex flex-col h-full border border-gray-100"
>
  <div class="relative h-48 overflow-hidden">
    <img [src]="data()?.image" [alt]="data()?.title" class="w-full h-full object-cover" />
    <div class="absolute bottom-0 left-0 w-full h-1 bg-orange-500"></div>
  </div>

  <div class="p-4 flex flex-col flex-grow">
    <h3 class="text-[15px] font-bold text-gray-800 leading-snug line-clamp-2 mb-6 min-h-[40px]">
      {{ data()?.title }}
    </h3>

    <div
      class="mt-auto pt-4 border-t border-gray-100 flex items-center justify-between text-gray-400 text-sm"
    >
      <div class="flex items-center gap-4">
        <span class="flex items-center gap-1">
          <i class="icon-calendar text-orange-400"></i>
          {{ data()?.date }}
        </span>
        <span class="flex items-center gap-1">
          <i class="icon-eye text-orange-400"></i>
          {{ data()?.views }}
        </span>
      </div>

      <button class="text-orange-500 hover:translate-x-1 transition-transform">
        <i class="icon-chevron-right font-bold"></i>
      </button>
    </div>
  </div>
</div>
